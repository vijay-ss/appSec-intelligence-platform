[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-shared"
version = "0.1.0"
description = "Shared schemas, config, and utilities for the AppSec Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["appsec_shared*"]
